# Bonus - round-robin load balancer in front of the "web" replicas.
# At start-up Docker's embedded DNS resolves "web" to the IPs of ALL
# replicas; nginx then distributes requests across them (round robin).
upstream visit_counter {
    zone visit_counter 64k;   # shared state -> round robin across all nginx workers
    server web:5000;
}

server {
    listen 80;
    location / {
        proxy_pass http://visit_counter;
        proxy_set_header Host $host;
    }
}
