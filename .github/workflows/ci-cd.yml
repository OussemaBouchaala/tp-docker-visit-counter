# ================================================================
# Part C - CI/CD pipeline (GitHub Actions)
# Triggered automatically on every commit pushed to "main":
#   1. build + unit tests (pytest)
#   2. build the Docker image and publish it to Docker Hub
# Required repository secrets:
#   DOCKERHUB_USERNAME  - Docker Hub user name
#   DOCKERHUB_TOKEN     - Docker Hub access token (Read & Write)
# ================================================================
name: CI-CD Visit-Counter

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:          # manual run button (optional)

env:
  APP_DIR: partB-visit-counter
  IMAGE_NAME: counter-app

jobs:
  build-and-test:
    name: 1 - Build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements-dev.txt

      - name: Install dependencies (build)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile app/app.py

      - name: Run unit tests
        run: pytest -v --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.APP_DIR }}/test-results.xml

  docker-build-push:
    name: 2 - Docker build & push to Docker Hub
    needs: build-and-test          # only if the tests passed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
